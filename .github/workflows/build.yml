name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed arm64 APK
        run: ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          UNSIGNED="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK was not produced"
            ls -lah app/build/outputs/apk/release || true
            if [ -f "$UNSIGNED" ]; then
              echo "Only an unsigned APK exists; signing is required for install"
            fi
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload signed arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
